{% extends 'base.html' %}{% block title %}Combined search{% endblock %}{% block content %}
<p class="eyebrow">IMAGE + TEXT</p><h1>Add context to your image.</h1>
<p class="text-muted">CLIP combines normalized image and text embeddings into one query.</p>
<form method="post" enctype="multipart/form-data" class="search-box">
<label class="form-label" for="image">Artwork image</label><input id="image" class="form-control" name="image" type="file" accept="image/*" required>
<label class="form-label mt-3" for="query">Description</label><textarea id="query" class="form-control" name="query" maxlength="2000" required>{{ query }}</textarea>
<label class="form-label mt-3" for="image_weight">Image weight (0 = text only, 1 = image only)</label>
<input id="image_weight" class="form-control" type="number" name="image_weight" min="0" max="1" step="0.1" value="{{ weight }}" required>
<button type="submit" class="btn btn-coral mt-3">Find with image and text →</button></form>
{% include 'results.html' %}{% endblock %}
